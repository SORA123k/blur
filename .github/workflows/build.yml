name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # the runner has no ACTIONS_RUNTIME_TOKEN, so the gha backend would fail
      VCPKG_BINARY_SOURCES: clear

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          "vcpkg root: $env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      # The Visual Studio generator is used on purpose: it needs no ninja, and the
      # windows runner image already carries MSVC + Windows SDK + vcpkg.
      - name: Configure
        shell: pwsh
        run: |
          # No -G on purpose: the runner image may ship any Visual Studio version
          # (2022 today, 2026 in newer images), and -A x64 makes CMake pick the
          # newest installed Visual Studio generator by itself.
          $env:CMAKE_GENERATOR = ''
          # the project forces a static boost + static CRT, so the triplet must be static
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target blur blur-cli

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\Release\blur-gui.exe, build\Release\blur-cli.exe out\
          Copy-Item -Recurse src\vapoursynth out\lib
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt out\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blur-windows-x64
          path: out/
