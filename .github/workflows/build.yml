name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9f8fff7f4cc138d96fe881c37878ee23ed395fc9

      - name: Configure
        shell: pwsh
        run: |
          # the project forces a static boost + static CRT, so the triplet must be static
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build --target blur blur-cli

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\blur-gui.exe, build\blur-cli.exe out\
          Copy-Item -Recurse src\vapoursynth out\lib
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt out\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blur-windows-x64
          path: out/
